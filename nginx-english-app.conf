# ============================================================
# nginx 配置 - 英语学习应用
#
# 部署步骤：
#   1. 把此文件上传到服务器 nginx 配置目录
#      scp nginx-english-app.conf root@SERVER_IP:/etc/nginx/conf.d/
#      （Ubuntu/Debian）或 /etc/nginx/sites-available/ + ln -s
#   2. 修改 server_name 为你的域名或 IP
#   3. 修改 root 路径与 deploy.sh 中 REMOTE_PATH 一致
#   4. nginx -t          # 测试配置
#   5. nginx -s reload   # 重载
# ============================================================

server {
    listen 80;
    # server_name your-domain.com;  # 有域名就取消注释改成你的域名
    server_name _;                  # 没有域名就先用 _ 匹配所有

    # 静态文件目录（与 deploy.sh 的 REMOTE_PATH 一致）
    root /var/www/english-app;
    index index.html;

    # SPA 路由支持：所有路径回退到 index.html
    # React Router 用的是 BrowserRouter，需要这个
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（Vite build 后 assets/ 下的文件名带 hash，可长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，确保更新即时生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # gzip 压缩（减小传输体积）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;
}
